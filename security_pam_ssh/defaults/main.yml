---
# ==============================================================================
# ОБЩИЕ НАСТРОЙКИ
# ==============================================================================
access_profiles_default: {}
access_profiles_extra: {}
pam_ssh_rules: >-
  {{
    access_profiles_default
    | combine(
        access_profiles_extra,
        recursive=true
      )
  }}

pam_ssh_backup_count: 3
# Сервер в домене (FreeIPA / AD / SSSD)
domain_joined: false
pam_ssh_domain_server: "{{ domain_joined | default(false) | bool }}"

domain_suffix: "domain.local"
pam_ssh_domain: "{{ domain_suffix }}"

pam_ssh_required_packages_domain:
  - sssd
  - libnss-sss
  - libpam-sss
  - libsss-sudo
  - sssd-tools

pam_ssh_required_packages_always:
  - libpam-pwquality

# Хэширование: yescrypt для современных Deb/Astra (glibc 2.35+)
pam_ssh_password_hash: "yescrypt" # Более старая альтернатива "sha512"
pam_ssh_password_remember: 5

# ==============================================================================
# MKHOMEDIR
# ==============================================================================
pam_ssh_mkhomedir_enable: true
pam_ssh_mkhomedir_umask: "0077"
pam_ssh_mkhomedir_skel: "/etc/skel"

# ==============================================================================
# GSSAPI ДЛЯ SUDO
# ==============================================================================
pam_ssh_gssapi_sudo_enable: "{{ pam_ssh_domain_server | default(false) | bool }}"
pam_ssh_gssapi_sudo_files:
  - "/etc/pam.d/sudo"
  - "/etc/pam.d/sudo-i"

# ==============================================================================
# SSH ACCESS CONTROL
# ==============================================================================

# Путь к файлу вынесен из хардкода
pam_ssh_access_file: "/etc/security/access-sshd.conf"

# Deny All в конце
pam_ssh_access_deny_all: true

# ==============================================================================
# FAILLOCK
# ==============================================================================
pam_ssh_faillock_enable: true
pam_ssh_faillock_deny: 5
pam_ssh_faillock_unlock_time: 900