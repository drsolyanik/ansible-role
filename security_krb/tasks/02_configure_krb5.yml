---
- name: Security KRB5 | Настройка /etc/krb5.conf
  ansible.builtin.template:
    src: krb5.conf.j2
    dest: /etc/krb5.conf
    owner: root
    group: root
    mode: '0755'
    backup: true

- name: Security KRB5 | Проверка синтаксиса через klist
  ansible.builtin.command: "klist -k"
  changed_when: false
  ignore_errors: true