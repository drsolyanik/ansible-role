- name: Security SSSD | Формирование правил доступа для доменов SSSD
  ansible.builtin.set_fact:
    _sssd_domain_rules: >-
      {{
        _sssd_domain_rules | default({})
        | combine({
            item: {
              'users': (
                _sssd_active_rules
                | selectattr('sssd_suffix', 'equalto', item)
                | selectattr('type', 'equalto', 'user')
                | map(attribute='identity')
                | map('regex_replace', '$', '@' ~ item)
                | list
              ),
              'groups': (
                _sssd_active_rules
                | selectattr('sssd_suffix', 'equalto', item)
                | selectattr('type', 'equalto', 'group')
                | map(attribute='identity')
                | map('regex_replace', '$', '@' ~ item)
                | list
              )
            }
          })
      }}
  loop: "{{ _sssd_suffixes }}"

- name: Security SSSD | Настройка доменной конфигурации
  ansible.builtin.template:
    src: domain.conf.j2
    dest: "/etc/sssd/conf.d/{{ item }}.conf"
    owner: root
    group: root
    mode: '0600'
  loop: "{{ _sssd_suffixes }}"
  loop_control:
    label: "{{ item }}"

- name: Security SSSD | Перезапуст SSSD
  ansible.builtin.systemd:
    name: sssd
    state: restarted

- name: Security SSSD | Ожидание перезапуска SSSD
  ansible.builtin.pause:
    seconds: 

- name: Security SSSD | Включение сервиса SSSD
  ansible.builtin.systemd:
    name: sssd
    enabled: true
    state: started