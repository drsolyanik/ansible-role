---
- name: Security PAM SSH | Проверка файлов sudo для GSSAPI
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ pam_ssh_gssapi_sudo_files }}"
  register: _pam_sudo_files_stat

- name: Security PAM SSH | Настройка pam_sss_gss.so в sudo
  ansible.builtin.lineinfile:
    path: "{{ item.item }}"
    regexp: '^\s*auth\s+(sufficient|required|optional)\s+pam_sss_gss\.so'
    line: "auth sufficient pam_sss_gss.so"
    insertbefore: '^(auth|account|session|password|@include\s+common-auth)'
    state: present
    firstmatch: true
    backup: true
  loop: "{{ _pam_sudo_files_stat.results }}"
  when: item.stat.exists
  register: _pam_sudo_lineinfile_result

- name: Security PAM SSH | Очистка старых бэкапов sudo кроме последних {{ pam_ssh_backup_count }} 
  ansible.builtin.shell: |
    ls -t {{ item.item | quote }}.*~ 2>/dev/null | tail -n +{{ (pam_ssh_backup_count | int) + 1 }} | xargs -r rm -f
  loop: "{{ _pam_sudo_lineinfile_result.results }}"
  when: item is changed | default(false) | bool
  changed_when: false

- name: Security PAM SSH | Логирование отсутствующих файлов sudo
  ansible.builtin.debug:
    msg: >-
      [WARNING]: Файл {{ item.item }} не найден.
      Беспарольный sudo по TGT (pam_sss_gss.so) не может быть настроен.
  loop: "{{ _pam_sudo_files_stat.results }}"
  when: not item.stat.exists